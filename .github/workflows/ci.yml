name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  SOROBAN_NETWORK: testnet
  CARGO_INCREMENTAL: 1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            escrow/target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('escrow/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-lint-
      - name: Check formatting
        run: cargo fmt --all -- --check
        working-directory: escrow
      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: escrow

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            escrow/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('escrow/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
      - name: Run tests
        run: cargo test --all
        working-directory: escrow
      - name: Run tests with testutils feature
        run: cargo test --all --features testutils
        working-directory: escrow

  build:
    name: Build Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            escrow/target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('escrow/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-
      - name: Install stellar-cli (prebuilt v28.0.0)
        run: |
          set -euo pipefail
          URL="https://github.com/stellar/stellar-cli/releases/download/v28.0.0/stellar-cli-28.0.0-x86_64-unknown-linux-gnu.tar.gz"
          TMP=$(mktemp -d)
          curl -fsSL --retry 3 -o "$TMP/stellar-cli.tar.gz" "$URL"
          tar -xzf "$TMP/stellar-cli.tar.gz" -C "$TMP"
          BIN=$(find "$TMP" -type f -name stellar | head -n1)
          if [ -z "$BIN" ]; then
            echo "ERROR: no 'stellar' binary found in $URL"
            tar -tzf "$TMP/stellar-cli.tar.gz"
            exit 1
          fi
          sudo install -m 0755 "$BIN" /usr/local/bin/stellar
          stellar --version
      - name: Build contract to WASM
        run: stellar contract build
        working-directory: escrow
      - name: Check contract size
        run: |
          WASM=$(find escrow/target/wasm32v1-none/release -maxdepth 1 -name "*.wasm" | head -n1)
          if [ -z "$WASM" ]; then
            echo "ERROR: no .wasm artifact found under escrow/target/wasm32v1-none/release/"
            exit 1
          fi
          SIZE=$(stat -c%s "$WASM")
          echo "Contract: $WASM"
          echo "Size: $SIZE bytes"
          MAX_SIZE=262144
          if [ "$SIZE" -gt "$MAX_SIZE" ]; then
            echo "ERROR: contract exceeds maximum size of $MAX_SIZE bytes"
            exit 1
          fi
      - name: Upload contract artifact
        uses: actions/upload-artifact@v4
        with:
          name: escrow-contract-wasm
          path: escrow/target/wasm32v1-none/release/*.wasm
          if-no-files-found: error

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Run security audit
        run: cargo audit
        working-directory: escrow
